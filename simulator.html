<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>多聚HRP反应模拟</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; background: #f4f5f7; color: #333; }
  #app { display: flex; height: 100vh; }
  /* 左侧控制面板 */
  #controls { width: 290px; padding: 10px 14px; overflow-y: auto; background: #fff; border-right: 1px solid #ddd; font-size: 12px; }
  #main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 12px; }
  #canvasWrap { position: relative; }
  canvas#canvas { background: #fff; border: 1px solid #ccc; box-shadow: 0 1px 6px rgba(0,0,0,0.08); display: block; }
  #legend { font-size: 11px; color: #666; margin-top: 6px; text-align: center; }
  #legend span { margin: 0 6px; white-space: nowrap; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 3px; vertical-align: middle; }
  /* 右侧统计面板 */
  #stats { width: 280px; padding: 10px 14px; overflow-y: auto; background: #fff; border-left: 1px solid #ddd; font-size: 12px; }
  h3 { margin: 10px 0 6px; font-size: 13px; color: #2c3e50; border-bottom: 1px solid #eee; padding-bottom: 3px; }
  .param { margin-bottom: 7px; }
  .param label { display: block; color: #555; margin-bottom: 2px; }
  .param .val { float: right; color: #2c5f8a; font-variant-numeric: tabular-nums; }
  .param input[type=range] { width: 100%; accent-color: #2c5f8a; }
  .btns { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0; }
  .btns button { padding: 6px 10px; border: 1px solid #bbb; background: #fff; border-radius: 3px; cursor: pointer; font-size: 12px; }
  .btns button:hover { background: #eef4fa; }
  #startBtn { background: #2c5f8a; color: #fff; border-color: #2c5f8a; }
  .stat-row { display: flex; justify-content: space-between; padding: 2px 0; font-variant-numeric: tabular-nums; }
  .stat-row span:first-child { color: #666; }
  #histCanvas { width: 100%; height: 140px; background: #fff; border: 1px solid #eee; }
  #gelCanvas { width: 100%; height: 36px; background: #fff; border: 1px solid #eee; }
  #pieCanvas { width: 100%; height: 120px; background: #fff; border: 1px solid #eee; }
  #warn { color: #c0392b; min-height: 16px; font-size: 11px; }
  .hint { color: #999; font-size: 11px; }
</style>
</head>
<body>
<div id="app">
  <!-- 左：参数与运行控制 -->
  <div id="controls">
    <h3>可调参数</h3>
    <div id="paramList"></div>
    <div id="warn"></div>
    <h3>运行控制</h3>
    <div class="btns">
      <button id="startBtn">开始</button>
      <button id="pauseBtn">暂停</button>
      <button id="resetBtn">重置系统</button>
      <button id="initBtn">初始化参数</button>
    </div>
    <div class="param">
      <label>每帧步数 <span class="val" id="spfVal">1</span></label>
      <input type="range" id="spf" min="1" max="50" value="1">
    </div>
    <div class="param">
      <label><input type="checkbox" id="periodic" checked> 周期性边界（默认开）</label>
      <label><input type="checkbox" id="uniformB"> 接头B均匀分布（默认关，随机分布）</label>
    </div>
    <div class="hint">注：改动后需点“重置系统”生效</div>
  </div>

  <!-- 中：主画布 -->
  <div id="main">
    <div id="canvasWrap"><canvas id="canvas"></canvas></div>
    <div id="legend">
      <span><i class="dot" style="background:#cccccc"></i>颗粒 P</span>
      <span><i class="dot" style="background:#e67e22"></i>接头 A</span>
      <span><i class="dot" style="background:#999"></i>骨架链</span>
      <span><i class="dot" style="background:#3498db"></i>接头 B</span>
      <span><i class="dot" style="background:#c0392b"></i>已形成键</span>
    </div>
  </div>

  <!-- 右：实时统计 -->
  <div id="stats">
    <h3>实时统计</h3>
    <div class="stat-row"><span>模拟时间 t</span><span id="simTime">0.00</span></div>
    <div class="stat-row"><span>步数</span><span id="stepCount">0</span></div>
    <div class="stat-row"><span>游离颗粒（数量/总数）</span><span id="freeP">0/0</span></div>
    <div class="stat-row"><span>游离骨架（数量/总数）</span><span id="freeC">0/0</span></div>
    <div class="stat-row"><span>成键总数</span><span id="bondCount">0</span></div>
    <div class="stat-row"><span>最大复合物 MW (kDa)</span><span id="maxComplex">0</span></div>
    <div class="stat-row"><span>多聚物数量</span><span id="nComplex">0</span></div>
    <div class="stat-row"><span>平均每个多聚物中颗粒的数量</span><span id="avgP">0.00</span></div>
    <div class="stat-row"><span>平均每个多聚物中骨架的数量</span><span id="avgC">0.00</span></div>
    <h3>结合占比</h3>
    <canvas id="pieCanvas"></canvas>
    <div class="hint" id="pieLabel"></div>
    <h3>分子量分布（kDa）</h3>
    <canvas id="histCanvas"></canvas>
    <div class="hint" id="histLabel"></div>
    <h3>蛋白胶条带模拟（kDa）</h3>
    <canvas id="gelCanvas"></canvas>
    <div class="hint" id="gelLabel"></div>
  </div>
</div>

<script>
/* ============================================================
 * 多价球状颗粒 + 多价柔性链 交联/多聚化 二维模拟
 * 纯前端单文件，Canvas 2D 渲染
 * 设计：模拟逻辑（Sim）与渲染逻辑（Render）分离
 * ============================================================ */

/* ---------- 工具函数 ---------- */
// Box-Muller 高斯随机数 N(0,1)
function gaussian() {
  let u = 0, v = 0;
  while (u === 0) u = Math.random();
  while (v === 0) v = Math.random();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

/* ---------- 参数定义（界面滑块） ---------- */
const PARAMS = [
  { key: 'S',         label: '系统尺寸 S',        min: 500, max: 1500,step: 100, value: 1000 },
  { key: 'rP',        label: '颗粒半径 rP',       min: 1,   max: 20,  step: 1,   value: 10   },
  { key: 'NP',        label: '颗粒数 NP',         min: 1,   max: 200, step: 1,   value: 100  },
  { key: 'nA',        label: '颗粒接头数 nA',     min: 2,   max: 20,  step: 2,   value: 8   },
  { key: 'L',         label: '骨架长度 L',        min: 5,   max: 50,  step: 5,   value: 5  },
  { key: 'NC',        label: '骨架数 NC',         min: 1,   max: 50,  step: 1,   value: 20  },
  { key: 'nB',        label: '骨架接头数 nB',     min: 1,   max: 40,  step: 1,   value: 8   },
  { key: 'diffusion', label: '扩散系数',          min: 10,  max: 100, step: 10,  value: 60   },
  { key: 'rReact',    label: '反应距离 rReact',   min: 1,   max: 10,  step: 1,   value: 2   },
  { key: 'pBind',     label: '结合概率 pBind',    min: 0,   max: 1,   step: 0.05,value: 0.1 },
  { key: 'dt',        label: '时间步长 dt',       min: 0.02,max: 1,   step: 0.02,value: 0.3 },
  { key: 'iterations',label: '约束迭代次数',       min: 1,   max: 10,  step: 1,   value: 3   },
  { key: 'chainMW',   label: '骨架分子量 (kDa)',   min: 10,  max: 100, step: 10,  value: 10  },
];
const params = {};
PARAMS.forEach(p => params[p.key] = p.value);

/* 内部派生常量（可在代码中调整） */
const BEAD_R = 3;      // 骨架珠子半径
const SEG_LEN = 7;     // 骨架相邻珠子平衡距离
const PARTICLE_MW = 44;    // 颗粒（HRP）分子量，固定 44 kDa

/* ---------- 运行状态 ---------- */
let state = null;
let running = false;
let stepsPerFrame = 1;
let periodic = true;
let uniformB = false;

/* ============================================================
 * 模拟模块 Sim
 * ============================================================ */
const Sim = {
  // 计算接头世界坐标
  anchorPos(obj, type, anchorIdx) {
    if (type === 'particle') {
      const a = obj.anchors[anchorIdx];
      return { x: obj.x + obj.r * Math.cos(a.angle),
               y: obj.y + obj.r * Math.sin(a.angle) };
    } else {
      const a = obj.anchors[anchorIdx];
      const b = obj.beads[a.beadIdx];
      return { x: b.x + BEAD_R * Math.cos(a.angle),
               y: b.y + BEAD_R * Math.sin(a.angle) };
    }
  },
  // 移动宿主（颗粒整体 / 珠子）
  moveObj(obj, type, anchorIdx, dx, dy) {
    if (type === 'particle') { obj.x += dx; obj.y += dy; }
    else { const b = obj.beads[obj.anchors[anchorIdx].beadIdx]; b.x += dx; b.y += dy; }
  },
  // 最小镜像（周期边界用）
  minImage(d) {
    if (!periodic) return d;
    const S = params.S;
    if (d > S / 2) return d - S;
    if (d < -S / 2) return d + S;
    return d;
  },

  // 构建初始状态
  build() {
    const S = params.S;
    let NP = params.NP, NC = params.NC, L = params.L;
    // 粒子总数上限 2000
    if (NP + NC * L > 2000) {
      NC = Math.max(1, Math.floor((2000 - NP) / L));
      showWarn(`粒子总数超 2000，骨架数已自动降为 NC=${NC}`);
    } else showWarn('');

    const particles = [], chains = [];
    // 颗粒
    for (let i = 0; i < NP; i++) {
      const anchors = [];
      for (let j = 0; j < params.nA; j++)
        anchors.push({ angle: Math.random() * 2 * Math.PI, bound: false, bondIdx: -1 });
      particles.push({ id: i, x: Math.random() * S, y: Math.random() * S, r: params.rP, anchors });
    }
    // 骨架：初始为直线段，整体随机放置并保证在界内
    for (let i = 0; i < NC; i++) {
      const dir = Math.random() * 2 * Math.PI;
      const half = (L - 1) / 2;
      const beads = [];
      for (let j = 0; j < L; j++)
        beads.push({ x: Math.cos(dir) * SEG_LEN * (j - half), y: Math.sin(dir) * SEG_LEN * (j - half) });
      // 平移到界内随机位置
      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      for (const b of beads) { minX = Math.min(minX, b.x); maxX = Math.max(maxX, b.x); minY = Math.min(minY, b.y); maxY = Math.max(maxY, b.y); }
      const ox = Math.random() * (S - (maxX - minX)), oy = Math.random() * (S - (maxY - minY));
      for (const b of beads) { b.x += ox - minX; b.y += oy - minY; }
      // 接头 B：均匀分布时按等间距分布在珠子序列上；否则随机分布在珠子上（允许同一珠子多个）
      const anchors = [];
      for (let j = 0; j < params.nB; j++) {
        const beadIdx = uniformB
          ? Math.min(L - 1, Math.floor((j + 0.5) * L / params.nB))
          : Math.floor(Math.random() * L);
        anchors.push({ beadIdx, angle: Math.random() * 2 * Math.PI, bound: false, bondIdx: -1 });
      }
      chains.push({ id: i, beads, anchors });
    }
    return { particles, chains, bonds: [], step: 0 };
  },

  // 单步推进
  step() {
    const S = params.S, sigma = params.diffusion * Math.sqrt(params.dt);
    // 1) 布朗位移
    for (const p of state.particles) { p.x += gaussian() * sigma; p.y += gaussian() * sigma; }
    for (const c of state.chains) for (const b of c.beads) { b.x += gaussian() * sigma; b.y += gaussian() * sigma; }

    // 2) 位置约束 PBD
    for (let it = 0; it < params.iterations; it++) {
      // 链段约束
      for (const c of state.chains) {
        for (let j = 0; j < c.beads.length - 1; j++) {
          const b1 = c.beads[j], b2 = c.beads[j + 1];
          let dx = this.minImage(b2.x - b1.x), dy = this.minImage(b2.y - b1.y);
          const dist = Math.sqrt(dx * dx + dy * dy) || 1e-6;
          const diff = (dist - SEG_LEN) / dist;
          const hx = dx * 0.5 * diff, hy = dy * 0.5 * diff;
          b1.x += hx; b1.y += hy; b2.x -= hx; b2.y -= hy;
        }
      }
      // 键约束（颗粒A – 骨架B，restLen = rReact）
      for (const bond of state.bonds) {
        if (!bond.alive) continue;
        const aObj = state.particles[bond.aObj]; // aType 恒为 particle
        const bObj = state.chains[bond.bObj];    // bType 恒为 chain
        const pa = this.anchorPos(aObj, 'particle', bond.aAnchorIdx);
        const pb = this.anchorPos(bObj, 'chain', bond.bAnchorIdx);
        let dx = this.minImage(pb.x - pa.x), dy = this.minImage(pb.y - pa.y);
        const dist = Math.sqrt(dx * dx + dy * dy) || 1e-6;
        const diff = (dist - params.rReact) / dist;
        const hx = dx * 0.5 * diff, hy = dy * 0.5 * diff;
        this.moveObj(aObj, 'particle', bond.aAnchorIdx, hx, hy);
        this.moveObj(bObj, 'chain', bond.bAnchorIdx, -hx, -hy);
      }
    }

    // 3) 反应判定（空间网格加速）
    this.react();

    // 4) 边界
    this.boundary();

    state.step++;
  },

  // 反应：未结合 A 与 B 距离<rReact 且 rand<pBind → 成永久键
  react() {
    const S = params.S, rR = params.rReact;
    const cell = Math.max(rR, 1), nC = Math.max(1, Math.ceil(S / cell));
    const grid = new Array(nC * nC);
    for (let i = 0; i < grid.length; i++) grid[i] = [];
    const cidx = (x, y) => clamp(Math.floor(x / cell), 0, nC - 1) + clamp(Math.floor(y / cell), 0, nC - 1) * nC;
    // 入桶：未结合 A
    for (let i = 0; i < state.particles.length; i++) {
      const p = state.particles[i];
      for (let j = 0; j < p.anchors.length; j++) {
        if (p.anchors[j].bound) continue;
        const a = this.anchorPos(p, 'particle', j);
        grid[cidx(a.x, a.y)].push({ pIdx: i, aIdx: j, x: a.x, y: a.y });
      }
    }
    // 对每个未结合 B 查 9 邻格
    for (let i = 0; i < state.chains.length; i++) {
      const c = state.chains[i];
      for (let j = 0; j < c.anchors.length; j++) {
        if (c.anchors[j].bound) continue;
        const bp = this.anchorPos(c, 'chain', j);
        const cx = clamp(Math.floor(bp.x / cell), 0, nC - 1);
        const cy = clamp(Math.floor(bp.y / cell), 0, nC - 1);
        for (let gy = cy - 1; gy <= cy + 1; gy++) {
          for (let gx = cx - 1; gx <= cx + 1; gx++) {
            let gxx = gx, gyy = gy;
            if (periodic) { gxx = (gx + nC) % nC; gyy = (gy + nC) % nC; }
            if (gxx < 0 || gxx >= nC || gyy < 0 || gyy >= nC) continue;
            const cellArr = grid[gyy * nC + gxx];
            for (const a of cellArr) {
              if (state.particles[a.pIdx].anchors[a.aIdx].bound) continue;
              let dx = this.minImage(bp.x - a.x), dy = this.minImage(bp.y - a.y);
              if (dx * dx + dy * dy < rR * rR && Math.random() < params.pBind) {
                const bi = state.bonds.length;
                state.bonds.push({ aObj: a.pIdx, aAnchorIdx: a.aIdx, bObj: i, bAnchorIdx: j, alive: true });
                state.particles[a.pIdx].anchors[a.aIdx].bound = true;
                state.particles[a.pIdx].anchors[a.aIdx].bondIdx = bi;
                c.anchors[j].bound = true; c.anchors[j].bondIdx = bi;
                break;
              }
            }
            if (c.anchors[j].bound) break;
          }
          if (c.anchors[j].bound) break;
        }
      }
    }
  },

  // 边界处理
  boundary() {
    const S = params.S;
    const wrap = (v) => ((v % S) + S) % S;
    for (const p of state.particles) {
      if (periodic) { p.x = wrap(p.x); p.y = wrap(p.y); }
      else { p.x = clamp(p.x, p.r, S - p.r); p.y = clamp(p.y, p.r, S - p.r); }
    }
    for (const c of state.chains) for (const b of c.beads) {
      if (periodic) { b.x = wrap(b.x); b.y = wrap(b.y); }
      else { b.x = clamp(b.x, BEAD_R, S - BEAD_R); b.y = clamp(b.y, BEAD_R, S - BEAD_R); }
    }
  },

  // 统计：连通分量（并查集）
  stats() {
    const NP = state.particles.length, NC = state.chains.length, N = NP + NC;
    const par = new Array(N); for (let i = 0; i < N; i++) par[i] = i;
    const find = (x) => { while (par[x] !== x) { par[x] = par[par[x]]; x = par[x]; } return x; };
    const uni = (a, b) => { const ra = find(a), rb = find(b); if (ra !== rb) par[ra] = rb; };
    for (const b of state.bonds) if (b.alive) uni(b.aObj, NP + b.bObj);
    const g = {};
    for (let i = 0; i < NP; i++) { const r = find(i); (g[r] = g[r] || { nP: 0, nC: 0, beads: 0 }).nP++; }
    for (let i = 0; i < NC; i++) { const r = find(NP + i); (g[r] = g[r] || { nP: 0, nC: 0, beads: 0 }); g[r].nC++; g[r].beads += state.chains[i].beads.length; }
    const complexes = Object.values(g);
    let freeP = 0, freeC = 0, maxMW = 0;
    const mwHist = {};
    // 蛋白胶条带强度数据：mw → 该分子量处颗粒总数（骨架非蛋白质，单独不显色，不计入）
    const mwParts = {};
    // 多聚物 = 发生交联的复合物（键只存在于颗粒–骨架之间，故同时含两者即已交联）
    let nPoly = 0, sumP = 0, sumC = 0;
    // 复合物分子量 (kDa) = 颗粒数×44 + 骨架数×骨架分子量
    const mwOf = (cx) => cx.nP * PARTICLE_MW + cx.nC * params.chainMW;
    for (const cx of complexes) {
      if (cx.nP === 1 && cx.nC === 0) freeP++;
      if (cx.nC === 1 && cx.nP === 0) freeC++;
      const mw = mwOf(cx);
      // 直方图仅统计含颗粒的复合物：单独颗粒 + 颗粒-骨架多聚物；单独骨架不计入
      if (cx.nP >= 1) mwHist[mw] = (mwHist[mw] || 0) + 1;
      if (cx.nP > 0) mwParts[mw] = (mwParts[mw] || 0) + cx.nP;
      if (mw > maxMW) maxMW = mw;
      if (cx.nP >= 1 && cx.nC >= 1) { nPoly++; sumP += cx.nP; sumC += cx.nC; }
    }
    const bondCount = state.bonds.filter(b => b.alive).length;
    return {
      time: state.step * params.dt, step: state.step,
      freeP, freeC, totalP: NP, totalC: NC, bondCount, maxMW,
      nComplex: complexes.length, nPoly,
      avgP: nPoly ? sumP / nPoly : 0,
      avgC: nPoly ? sumC / nPoly : 0,
      mwHist, mwParts
    };
  }
};

/* ============================================================
 * 渲染模块 Render（与模拟逻辑分离）
 * ============================================================ */
const Render = {
  ctx: null, histCtx: null, gelCtx: null, dispSize: 0,

  init() {
    this.ctx = document.getElementById('canvas').getContext('2d');
    this.histCtx = document.getElementById('histCanvas').getContext('2d');
    this.gelCtx = document.getElementById('gelCanvas').getContext('2d');
    this.pieCtx = document.getElementById('pieCanvas').getContext('2d');
    this.resize();
    window.addEventListener('resize', () => this.resize());
  },
  resize() {
    const wrap = document.getElementById('canvasWrap').parentElement;
    const dpr = window.devicePixelRatio || 1;
    const size = Math.max(200, Math.min(wrap.clientWidth - 40, wrap.clientHeight - 60));
    this.dispSize = size;
    const c = document.getElementById('canvas');
    c.style.width = size + 'px'; c.style.height = size + 'px';
    c.width = size * dpr; c.height = size * dpr;
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  },

  main() {
    if (!state) return;
    const ctx = this.ctx, S = params.S, sc = this.dispSize / S;
    // 白底 + 浅灰网格
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, this.dispSize, this.dispSize);
    ctx.strokeStyle = '#eee'; ctx.lineWidth = 1;
    const gs = S / 10;
    for (let g = 0; g <= S + 0.1; g += gs) {
      ctx.beginPath(); ctx.moveTo(g * sc, 0); ctx.lineTo(g * sc, this.dispSize); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, g * sc); ctx.lineTo(this.dispSize, g * sc); ctx.stroke();
    }
    // 键（周期边界下，两端跨越边界的键不绘制，避免出现贯穿画布的伪影线）
    ctx.strokeStyle = '#c0392b'; ctx.lineWidth = 1.6;
    const halfS = S / 2;
    for (const b of state.bonds) {
      if (!b.alive) continue;
      const pa = Sim.anchorPos(state.particles[b.aObj], 'particle', b.aAnchorIdx);
      const pb = Sim.anchorPos(state.chains[b.bObj], 'chain', b.bAnchorIdx);
      if (periodic && (Math.abs(pb.x - pa.x) > halfS || Math.abs(pb.y - pa.y) > halfS)) continue;
      ctx.beginPath(); ctx.moveTo(pa.x * sc, pa.y * sc); ctx.lineTo(pb.x * sc, pb.y * sc); ctx.stroke();
    }
    // 骨架
    ctx.lineWidth = 1.4;
    for (const c of state.chains) {
      ctx.strokeStyle = '#888';
      ctx.beginPath();
      for (let j = 0; j < c.beads.length; j++) {
        const b = c.beads[j];
        if (j === 0) { ctx.moveTo(b.x * sc, b.y * sc); continue; }
        const prev = c.beads[j - 1];
        // 周期边界下相邻珠子跨越边界时断开该段，避免折线贯穿画布
        if (periodic && (Math.abs(b.x - prev.x) > S / 2 || Math.abs(b.y - prev.y) > S / 2)) ctx.moveTo(b.x * sc, b.y * sc);
        else ctx.lineTo(b.x * sc, b.y * sc);
      }
      ctx.stroke();
      for (const b of c.beads) {
        ctx.fillStyle = '#aaa';
        ctx.beginPath(); ctx.arc(b.x * sc, b.y * sc, BEAD_R * sc, 0, 2 * Math.PI); ctx.fill();
      }
      // 接头 B
      for (let k = 0; k < c.anchors.length; k++) {
        const a = c.anchors[k], ap = Sim.anchorPos(c, 'chain', k);
        ctx.fillStyle = a.bound ? '#1a5276' : '#3498db';
        ctx.beginPath(); ctx.arc(ap.x * sc, ap.y * sc, Math.max(2.5, BEAD_R * sc + 0.6), 0, 2 * Math.PI); ctx.fill();
      }
    }
    // 颗粒
    for (const p of state.particles) {
      ctx.fillStyle = '#cccccc'; ctx.strokeStyle = '#888'; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.arc(p.x * sc, p.y * sc, p.r * sc, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();
      // 接头 A
      for (let k = 0; k < p.anchors.length; k++) {
        const a = p.anchors[k], ap = Sim.anchorPos(p, 'particle', k);
        ctx.fillStyle = a.bound ? '#7a1f10' : '#e67e22';
        ctx.beginPath(); ctx.arc(ap.x * sc, ap.y * sc, Math.max(2.5, p.r * sc * 0.18 + 0.6), 0, 2 * Math.PI); ctx.fill();
      }
    }
  },

  hist(st) {
    const ctx = this.histCtx, dpr = window.devicePixelRatio || 1;
    const w = document.getElementById('histCanvas').clientWidth;
    const h = 140;
    const c = document.getElementById('histCanvas');
    c.width = w * dpr; c.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
    const entries = Object.entries(st.mwHist).map(([mw, c]) => ({ mw: +mw, c }));
    if (entries.length === 0) { document.getElementById('histLabel').textContent = '暂无数据'; return; }
    entries.sort((a, b) => a.mw - b.mw);
    // 固定横坐标：0–600 kDa，间隔 20，共 30 个箱
    const minMW = 0, maxMW = 600, binSize = 20, nBins = 30;
    const bins = new Array(nBins).fill(0);
    let overflow = 0;
    for (const e of entries) {
      let bi = Math.floor((e.mw - minMW) / binSize);
      if (bi < 0) bi = 0;
      if (bi >= nBins) { bins[nBins - 1] += e.c; overflow += e.c; }
      else bins[bi] += e.c;
    }
    const maxC = Math.max(...bins) || 1;
    const barW = w / nBins, pad = 0, baseY = h - 16;
    ctx.fillStyle = '#b3b3b3'; ctx.strokeStyle = '#888'; ctx.lineWidth = 1;
    for (let i = 0; i < nBins; i++) {
      const bh = (bins[i] / maxC) * (baseY - 14);
      const x = i * barW;
      ctx.fillRect(x + pad, baseY - bh, barW - 2 * pad, bh);
      if (bins[i] > 0) { ctx.fillStyle = '#555'; ctx.font = '9px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(bins[i], x + barW / 2, baseY - bh - 2); ctx.fillStyle = '#b3b3b3'; }
    }
    ctx.fillStyle = '#666'; ctx.font = '9px sans-serif'; ctx.textAlign = 'center';
    for (let i = 0; i < nBins; i++) if (i % 5 === 0) ctx.fillText(minMW + i * binSize, i * barW + barW / 2, h - 3);
    const realMax = entries[entries.length - 1].mw;
    document.getElementById('histLabel').textContent = ``;
  },

  // 蛋白胶条带模拟：横向条带，左低右高，MW范围 10–800 kDa，对数刻度
  // 只有颗粒（蛋白质）能被染色显带；骨架非蛋白质，单独不显带，仅参与多聚物分子量计算
  // 条带强度（灰度与宽度）与该条带所含颗粒总数成正比，带扩散渐变边缘，近似真实 SDS-PAGE
  gel(st) {
    const ctx = this.gelCtx, dpr = window.devicePixelRatio || 1;
    const w = document.getElementById('gelCanvas').clientWidth;
    const h = 36;
    const c = document.getElementById('gelCanvas');
    c.width = w * dpr; c.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    // 凝胶背景（浅灰，模拟聚丙烯酰胺胶体）
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, h);
    const entries = Object.entries(st.mwParts).map(([mw, p]) => ({ mw: +mw, p }));
    if (entries.length === 0) {
      ctx.fillStyle = '#888'; ctx.font = '11px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('暂无数据', w / 2, h / 2);
      document.getElementById('gelLabel').textContent = '';
      return;
    }
    // 对数刻度：log10(20)≈1.301 → log10(800)≈2.903，映射到 [padL, w-padR]
    const MW_MIN = 20, MW_MAX = 800;
    const logMin = Math.log10(MW_MIN), logMax = Math.log10(MW_MAX);
    // 左右边距需容纳居中绘制的刻度文字（"20"/"800" 半宽约 8px），避免端点刻度被裁剪
    const padL = 12, padR = 12, topY = 12, botY = h - 2;
    const laneH = botY - topY;
    const xOf = mw => padL + (Math.log10(Math.max(mw, MW_MIN)) - logMin) / (logMax - logMin) * (w - padL - padR);
    // 堵孔效应：分子量超过 700 kDa 的复合物无法进入胶孔，统一滞留渲染在 700 kDa 处，强度累加
    const PORE_LIMIT = 700;
    const agg = {};
    for (const e of entries) {
      const mw = Math.min(e.mw, PORE_LIMIT);
      agg[mw] = (agg[mw] || 0) + e.p;
    }
    // 条带强度 = 该分子量处颗粒总数（与蛋白量成正比）
    const items = Object.entries(agg).map(([mw, p]) => ({ mw: +mw, intensity: p }));
    const maxI = Math.max(...items.map(i => i.intensity)) || 1;
    // 排序后逐条绘制（按 MW 升序，避免重叠遮盖问题）
    items.sort((a, b) => a.mw - b.mw);
    for (const it of items) {
      const cx = xOf(it.mw);
      const norm = it.intensity / maxI; // 0–1
      // 灰度：强度越高越深（0=黑, 255=白），最浅不超过 180，保证弱条带仍深于背景灰（232）
      const gray = Math.round(180 - norm * 155); // 最深约 25，最浅约 180
      // 宽度：强度越高越粗（1.5–10px）
      const bandW = 1.5 + norm * 8.5;
      // 水平渐变：中心深、左右边缘淡（模拟染色扩散）
      const grad = ctx.createLinearGradient(cx - bandW / 2, 0, cx + bandW / 2, 0);
      grad.addColorStop(0,    `rgba(${gray},${gray},${gray},0)`);
      grad.addColorStop(0.5,  `rgba(${gray},${gray},${gray},0.95)`);
      grad.addColorStop(1,    `rgba(${gray},${gray},${gray},0)`);
      ctx.fillStyle = grad;
      ctx.fillRect(cx - bandW / 2, topY, bandW, laneH);
    }
    // 顶部 MW 刻度（20, 50, 100, 200, 400, 800）
    const ticks = [20, 50, 100, 200, 400, 800];
    ctx.fillStyle = '#555'; ctx.font = '9px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    for (const t of ticks) {
      const x = xOf(t);
      ctx.fillRect(x, topY - 3, 1, 3);
      ctx.fillText(t, x, topY - 12);
    }
    document.getElementById('gelLabel').textContent = ``;
  },

  pie(st) {
    const ctx = this.pieCtx, dpr = window.devicePixelRatio || 1;
    const c = document.getElementById('pieCanvas');
    const w = c.clientWidth, h = 120;
    c.width = w * dpr; c.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
    const drawPie = (cx, cy, r, free, total, colFree, colBound) => {
      if (total <= 0) { ctx.fillStyle = '#ccc'; ctx.beginPath(); ctx.arc(cx, cy, r, 0, 2 * Math.PI); ctx.fill(); return; }
      const frac = free / total;
      ctx.beginPath(); ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + 2 * Math.PI * frac);
      ctx.closePath(); ctx.fillStyle = colFree; ctx.fill();
      if (frac < 1) {
        ctx.beginPath(); ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, r, -Math.PI / 2 + 2 * Math.PI * frac, -Math.PI / 2 + 2 * Math.PI);
        ctx.closePath(); ctx.fillStyle = colBound; ctx.fill();
      }
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, 2 * Math.PI); ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 10px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(Math.round((1 - frac) * 100) + '%', cx, cy);
    };
    const r = Math.min(w * 0.16, 36), cy = h / 2 - 10;
    drawPie(w * 0.25, cy, r, st.freeP, st.totalP, '#cccccc', '#EE7600');
    drawPie(w * 0.75, cy, r, st.freeC, st.totalC, '#b3b3b3', '#1C86EE');
    ctx.fillStyle = '#555'; ctx.font = '10px sans-serif'; ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'center';
    ctx.fillText(`颗粒  游离${st.freeP}/结合${st.totalP - st.freeP}`, w * 0.25, h - 4);
    ctx.fillText(`骨架  游离${st.freeC}/结合${st.totalC - st.freeC}`, w * 0.75, h - 4);
    document.getElementById('pieLabel').textContent = '';
  }
};

/* ============================================================
 * UI 绑定
 * ============================================================ */
function showWarn(msg) { document.getElementById('warn').textContent = msg; }

function buildParamUI() {
  const list = document.getElementById('paramList');
  PARAMS.forEach(p => {
    const div = document.createElement('div');
    div.className = 'param';
    div.innerHTML = `<label>${p.label} <span class="val" id="val_${p.key}">${p.value}</span></label>
      <input type="range" id="param_${p.key}" min="${p.min}" max="${p.max}" step="${p.step}" value="${p.value}">`;
    list.appendChild(div);
    const inp = div.querySelector('input'), val = div.querySelector('.val');
    inp.addEventListener('input', () => {
      params[p.key] = parseFloat(inp.value);
      val.textContent = inp.value;
    });
  });
}

function updateStatsUI(st) {
  const set = (id, v) => document.getElementById(id).textContent = v;
  set('simTime', st.time.toFixed(2));
  set('stepCount', st.step);
  set('freeP', `${st.freeP}/${st.totalP}`);
  set('freeC', `${st.freeC}/${st.totalC}`);
  set('bondCount', st.bondCount);
  set('maxComplex', st.maxMW);
  set('nComplex', st.nPoly);
  set('avgP', st.avgP.toFixed(2));
  set('avgC', st.avgC.toFixed(2));
}

function bindButtons() {
  document.getElementById('startBtn').onclick = () => { if (state) running = true; };
  document.getElementById('pauseBtn').onclick = () => { running = false; };
  document.getElementById('resetBtn').onclick = () => {
    running = false;
    state = Sim.build();
  };
  document.getElementById('initBtn').onclick = () => {
    // 将所有参数滑块重置为默认值并刷新显示
    PARAMS.forEach(p => {
      params[p.key] = p.value;
      const inp = document.getElementById('param_' + p.key);
      const val = document.getElementById('val_' + p.key);
      if (inp) inp.value = p.value;
      if (val) val.textContent = p.value;
    });
    // 每帧步数也重置为 1
    stepsPerFrame = 1;
    const spf = document.getElementById('spf');
    if (spf) { spf.value = 1; document.getElementById('spfVal').textContent = 1; }
    // 重建系统
    running = false;
    state = Sim.build();
  };
  document.getElementById('spf').addEventListener('input', (e) => {
    stepsPerFrame = parseInt(e.target.value); document.getElementById('spfVal').textContent = stepsPerFrame;
  });
  document.getElementById('periodic').addEventListener('change', (e) => { periodic = e.target.checked; });
  document.getElementById('uniformB').addEventListener('change', (e) => { uniformB = e.target.checked; });
}

/* 主循环 */
function loop() {
  if (running && state) for (let i = 0; i < stepsPerFrame; i++) Sim.step();
  Render.main();
  requestAnimationFrame(loop);
}

/* 启动 */
buildParamUI();
bindButtons();
Render.init();
state = Sim.build();
loop();
setInterval(() => { if (state) { const st = Sim.stats(); updateStatsUI(st); Render.hist(st); Render.gel(st); Render.pie(st); } }, 500);
</script>
